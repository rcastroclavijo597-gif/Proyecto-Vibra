<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="assets/css/fonts.css">

<body data-root="">
  <main class="auth">
    <section class="auth__side">
      <div class="auth__top">
        <a class="logo" href="index.html"><span class="logo__mark"><i data-icon="logo"></i></span>vibra</a>
        <a class="btn btn--outline" href="login.html">Iniciar sesión</a>
      </div>

      <div class="auth__form-wrap">
        <a class="auth__back" href="index.html"><i data-icon="arrowLeft"></i> Volver al inicio</a>
        <span class="eyebrow">Únete a Vibra</span>
        <h1 class="auth__title">Empecemos a crear<br>algo grande.</h1>
        <p class="auth__lead">Cuéntanos un poco sobre ti. Solo te llevará un minuto.</p>

        <form id="form-auth" novalidate>
          <div class="grid-2">
            <div class="field"><label for="nombre">Nombre</label><input class="input" id="nombre" name="nombre" placeholder="Tu nombre" autocomplete="given-name"></div>
            <div class="field"><label for="apellidos">Apellidos</label><input class="input" id="apellidos" name="apellidos" placeholder="Tus apellidos" autocomplete="family-name"></div>
          </div>
          <div class="field"><label for="email">Correo electrónico</label><input class="input" id="email" name="email" type="email" placeholder="tu@email.com" autocomplete="email"></div>
          <div class="field"><label for="telefono">Teléfono</label><input class="input" id="telefono" name="telefono" type="tel" placeholder="+34 600 000 000" autocomplete="tel"></div>
          <div class="field">
            <label for="password">Contraseña</label>
            <div class="input-group">
              <input class="input" id="password" name="password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
              <button class="input-group__btn" type="button" data-ver-password aria-label="Mostrar contraseña"><i data-icon="eye"></i></button>
            </div>
          </div>
          <div class="field">
            <label class="checkbox"><input type="checkbox" name="terminos"> <span>Acepto los <a href="#" onclick="return false">términos de uso</a> y la política de privacidad.</span></label>
          </div>
          <button class="btn btn--mint btn--block" type="submit">Crear mi cuenta <i data-icon="arrowRight" class="icon icon--sm"></i></button>
        </form>
        <p class="auth__alt">¿Ya tienes una cuenta? <a href="login.html">Iniciar sesión</a></p>
      </div>
    </section>
