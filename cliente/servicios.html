<!DOCTYPE html>

      <div class="step-pill" style="--p:33%"><b>PASO 1 DE 3</b><i></i></div>

      <div class="selection-bar">
        <div>
          <small id="seleccion-titulo">Aún no has seleccionado servicios</small>
          <strong id="seleccion-texto">Tu evento empieza a tomar forma.</strong>
        </div>
        <button class="btn btn--mint" id="btn-continuar" type="button">Continuar <i data-icon="arrowRight" class="icon icon--sm"></i></button>
      </div>
    </div>
  </main>
